<script>
const fromName = /[?&]from=name/.test(location.search);
SU.mount({ at: 'mid', title: 'Kartu tutorial' });
if (fromName) {
  const mobile = innerWidth < 700;
  Object.assign(SU.momo().pose, {
    x: innerWidth * (mobile ? .81 : .86),
    y: mobile ? Math.max(100, innerHeight * .12) : Math.max(152, innerHeight * .238),
    s: mobile ? .69 : .88,
    r: 0,
  });
}
SU.run(SU.kartuScene({ fromName })).then(function () { SU.go('bab'); });
</script>
