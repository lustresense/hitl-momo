<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Kanban Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="cp">
  <div id="app" class="app-layout">
    <header class="topbar">
      <div class="brand">
        <span class="mark">◫</span>
        <span class="brand-text">Hermes Kanban</span>
      </div>
      <div class="board-selector">
        <label for="board-select" class="sr-only">Select Board</label>
        <select id="board-select" aria-label="Select board">
          <option value="">Loading boards...</option>
        </select>
      </div>
      <div class="topbar-actions">
        <button id="auth-logout-btn" class="btn sm" title="Log out of current session">Logout</button>
        <button id="refresh-btn" class="btn sm" title="Refresh board data">Refresh</button>
      </div>
    </header>

    <main class="board-container">
      <header class="board-header">
        <div class="board-info">
          <h1 id="board-title">Board</h1>
          <p id="board-subtitle">Read-only view</p>
        </div>
        <div class="board-filters">
          <div class="filter-group">
            <label for="assignee-filter">Assignee:</label>
            <select id="assignee-filter">
              <option value="">All Assignees</option>
            </select>
          </div>
          <div class="filter-group">
            <input type="search" id="search-input" placeholder="Search tasks..." aria-label="Search tasks">
          </div>
        </div>
      </header>

      <!-- Mobile Column Navigation Tabs -->
      <nav id="col-tabs" class="col-tabs" role="tablist" aria-label="Task status tabs"></nav>

      <!-- Kanban Columns Grid -->
      <section id="board-columns" class="columns-grid" aria-label="Kanban columns"></section>
    </main>

    <!-- Task Detail Drawer / Modal -->
    <div id="task-drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-overlay" id="drawer-overlay"></div>
      <div class="drawer-content">
        <header class="drawer-header">
          <h2 id="drawer-title">Task Details</h2>
          <button id="drawer-close" class="btn-close" aria-label="Close dialog">&times;</button>
        </header>
        <div id="drawer-body" class="drawer-body"></div>
      </div>
    </div>

    <!-- Authentication Modal (Login & Setup Shell) -->
    <div id="auth-modal" class="modal-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
      <div class="modal-backdrop"></div>
      <div class="modal-card">
        <header class="modal-header">
          <div class="brand-badge">
            <span class="mark">◫</span>
            <span class="brand-text">Hermes Kanban</span>
          </div>
          <h2 id="auth-modal-title">Sign In</h2>
          <p id="auth-modal-desc" class="modal-desc">Enter your admin password to authenticate this session. Sessions are secured with HttpOnly cookies.</p>
        </header>
        <form id="auth-form" class="auth-form" onsubmit="return false;">
          <div class="form-group" id="auth-password-group">
            <label for="auth-token-input" id="auth-password-label">Admin Password</label>
            <input type="password" id="auth-token-input" placeholder="Enter password..." autocomplete="current-password" required spellcheck="false">
          </div>
          <div class="form-group hidden" id="auth-confirm-group">
            <label for="auth-confirm-input" id="auth-confirm-label">Confirm Password</label>
            <input type="password" id="auth-confirm-input" placeholder="Confirm password..." autocomplete="new-password" spellcheck="false">
          </div>
          <div id="auth-error-msg" class="auth-error-msg hidden" role="alert"></div>
          <div class="modal-actions">
            <button type="submit" id="auth-token-submit" class="btn primary">Sign In</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
