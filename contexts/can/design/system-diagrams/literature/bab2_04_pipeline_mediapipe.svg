<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="64" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">Pipeline Finger Tracking MediaPipe untuk Drawing Canvas</text>
  <text x="60" y="98" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">Gerakan jari diterjemahkan menjadi goresan digital yang kemudian dipakai sebagai input klasifikasi.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; rx:16; }
      .tech { fill:#eff6ff; stroke:#93c5fd; stroke-width:2; rx:16; }
      .canvas { fill:#ecfdf5; stroke:#86efac; stroke-width:2; rx:16; }
      .title { font-family:Arial, sans-serif; font-size:20px; font-weight:700; fill:#172033; }
      .body { font-family:Arial, sans-serif; font-size:15px; fill:#334155; }
      .small { font-family:Arial, sans-serif; font-size:13px; fill:#64748b; }
      .arrow { stroke:#334155; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect class="box" x="70" y="190" width="185" height="120"/>
  <text class="title" x="95" y="228">Kamera RGB</text>
  <text class="body" x="95" y="262">Menangkap</text>
  <text class="body" x="95" y="286">gerakan tangan</text>
  <path class="arrow" d="M255 250 H330"/>
  <rect class="tech" x="330" y="190" width="220" height="120"/>
  <text class="title" x="355" y="228">Palm Detector</text>
  <text class="body" x="355" y="262">Mendeteksi area</text>
  <text class="body" x="355" y="286">telapak tangan</text>
  <path class="arrow" d="M550 250 H625"/>
  <rect class="tech" x="625" y="190" width="235" height="120"/>
  <text class="title" x="650" y="228">Hand Landmarks</text>
  <text class="body" x="650" y="262">Memprediksi titik</text>
  <text class="body" x="650" y="286">skeleton tangan</text>
  <path class="arrow" d="M860 250 H935"/>
  <rect class="canvas" x="935" y="190" width="205" height="120"/>
  <text class="title" x="960" y="228">Drawing Canvas</text>
  <text class="body" x="960" y="262">Ujung jari menjadi</text>
  <text class="body" x="960" y="286">goresan digital</text>
  <path class="arrow" d="M1038 310 V395 H770"/>
  <rect class="box" x="520" y="395" width="250" height="125"/>
  <text class="title" x="545" y="433">Gambar Siswa</text>
  <text class="body" x="545" y="467">Sketsa dikirim</text>
  <text class="body" x="545" y="491">ke klasifikasi visual</text>
  <path class="arrow" d="M520 458 H420"/>
  <rect class="box" x="210" y="395" width="210" height="125"/>
  <text class="title" x="235" y="433">Output AI</text>
  <text class="body" x="235" y="467">Top-3 prediction</text>
  <text class="body" x="235" y="491">dan confidence</text>
  <text class="small" x="60" y="650">Sumber: diadaptasi dari [11], [12], [13].</text>
</svg>
